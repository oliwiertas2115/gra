<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steal the Brainrot Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1>Steal the Brainrot 🧠</h1>
        <div class="stats">
            <p>Brain Points: <span id="points">0</span></p>
            <p>Rizz Level: <span id="level">1</span></p>
        </div>

        <div id="main-target" class="target">
            <img src="https://via.placeholder.com/150?text=MEME" alt="Target" id="target-img">
        </div>

        <div class="shop">
            <h3>Sklep u Sigmy</h3>
            <button id="upgrade-click">Lepsze kliknięcie (Koszt: 10)</button>
            <button id="auto-clicker">Auto-Stealer (Koszt: 50)</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
